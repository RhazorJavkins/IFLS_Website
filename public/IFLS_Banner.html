<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Noto+Serif+SC:wght@600;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 416px;
    overflow: hidden;
    font-family: 'Noto Sans SC', sans-serif;
    background: #0a1628;
  }

  .banner {
    width: 1200px;
    height: 416px;
    position: relative;
    background: linear-gradient(135deg, #0a1628 0%, #1a2744 40%, #0f1f3a 100%);
    overflow: hidden;
  }

  /* Decorative geometric shapes */
  .banner::before {
    content: '';
    position: absolute;
    top: -80px;
    right: -80px;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(220, 50, 50, 0.12) 0%, transparent 70%);
  }

  .banner::after {
    content: '';
    position: absolute;
    bottom: -100px;
    left: 300px;
    width: 500px;
    height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(220, 50, 50, 0.08) 0%, transparent 70%);
  }

  /* Gold accent line */
  .accent-line {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 4px;
    background: linear-gradient(90deg, #dc3232 0%, #f0a030 50%, #dc3232 100%);
  }

  .accent-line-bottom {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 3px;
    background: linear-gradient(90deg, #dc3232 0%, #f0a030 50%, #dc3232 100%);
  }

  /* Content layout */
  .content {
    position: relative;
    z-index: 2;
    display: flex;
    height: 100%;
    padding: 40px 50px 40px 50px;
    gap: 40px;
  }

  /* Left section - Brand & main message */
  .left {
    flex: 0 0 48%;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .brand-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
  }

  .brand-icon {
    width: 48px;
    height: 48px;
    background: linear-gradient(135deg, #dc3232 0%, #b02020 100%);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 900;
    color: #fff;
    font-family: 'Noto Serif SC', serif;
    box-shadow: 0 4px 15px rgba(220, 50, 50, 0.3);
  }

  .brand-name {
    font-size: 22px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 1px;
  }

  .brand-name span {
    color: #f0a030;
  }

  .headline {
    font-size: 36px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1.2;
    margin-bottom: 12px;
    font-family: 'Noto Serif SC', serif;
  }

  .headline .highlight {
    color: #f0a030;
  }

  .subtitle {
    font-size: 14px;
    color: rgba(255,255,255,0.6);
    font-weight: 300;
    line-height: 1.6;
    margin-bottom: 20px;
    max-width: 380px;
  }

  /* CTA Button */
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, #dc3232 0%, #e05530 100%);
    color: #fff;
    padding: 12px 28px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    width: fit-content;
    box-shadow: 0 4px 20px rgba(220, 50, 50, 0.35);
    letter-spacing: 0.5px;
  }

  /* Right section - Services */
  .right {
    flex: 0 0 48%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 12px;
  }

  .service-card {
    display: flex;
    align-items: center;
    gap: 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 14px 20px;
    backdrop-filter: blur(10px);
    transition: all 0.3s;
  }

  .service-icon {
    width: 42px;
    height: 42px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .service-icon.red {
    background: rgba(220, 50, 50, 0.15);
    color: #ff6b6b;
  }

  .service-icon.gold {
    background: rgba(240, 160, 48, 0.15);
    color: #f0a030;
  }

  .service-icon.blue {
    background: rgba(60, 130, 220, 0.15);
    color: #60a0ff;
  }

  .service-icon.green {
    background: rgba(50, 200, 130, 0.15);
    color: #40d090;
  }

  .service-text {
    flex: 1;
  }

  .service-title {
    font-size: 15px;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 2px;
  }

  .service-desc {
    font-size: 11px;
    color: rgba(255,255,255,0.45);
    font-weight: 300;
  }

  /* Bottom stats bar */
  .stats-bar {
    position: absolute;
    bottom: 3px;
    left: 0;
    right: 0;
    z-index: 3;
    display: flex;
    justify-content: center;
    gap: 50px;
    padding: 10px 50px;
    background: rgba(10, 22, 40, 0.85);
    backdrop-filter: blur(10px);
  }

  .stat {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .stat-number {
    font-size: 18px;
    font-weight: 900;
    color: #f0a030;
    font-family: 'Noto Serif SC', serif;
  }

  .stat-label {
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    font-weight: 300;
  }

  /* Decorative dots pattern */
  .dots-pattern {
    position: absolute;
    top: 30px;
    right: 30px;
    z-index: 1;
    opacity: 0.15;
  }

  .dots-pattern span {
    display: inline-block;
    width: 4px;
    height: 4px;
    background: #f0a030;
    border-radius: 50%;
    margin: 6px;
  }
</style>
</head>
<body>
<div class="banner">
  <div class="accent-line"></div>
  <div class="accent-line-bottom"></div>

  <!-- Decorative dots -->
  <div class="dots-pattern" id="dots"></div>

  <div class="content">
    <!-- Left: Brand + Headline -->
    <div class="left">
      <div class="brand-row">
        <div class="brand-icon">艾</div>
        <div class="brand-name">IF <span>Language</span> Center</div>
      </div>

      <div class="headline">
        印尼最佳<span class="highlight">语言</span>服务
      </div>

      <div class="subtitle">
        专业培训 · 翻译服务 · 奖学金咨询<br>
        海内存知己，天涯若比邻
      </div>

      <div class="cta">
        立即咨询 →
      </div>
    </div>

    <!-- Right: Services -->
    <div class="right">
      <div class="service-card">
        <div class="service-icon red">培</div>
        <div class="service-text">
          <div class="service-title">语言培训</div>
          <div class="service-desc">印尼语 · 中文 · 英语 | 基础到商务</div>
        </div>
      </div>

      <div class="service-card">
        <div class="service-icon gold">译</div>
        <div class="service-text">
          <div class="service-title">专业翻译</div>
          <div class="service-desc">文件翻译 · 宣誓翻译 · 口译服务</div>
        </div>
      </div>

      <div class="service-card">
        <div class="service-icon blue">奖</div>
        <div class="service-text">
          <div class="service-title">中国奖学金</div>
          <div class="service-desc">北京 · 上海 · 杭州 | 顶级大学</div>
        </div>
      </div>

      <div class="service-card">
        <div class="service-icon green">伙</div>
        <div class="service-text">
          <div class="service-title">官方合作</div>
          <div class="service-desc">印尼教育部语言发展局合作伙伴</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom stats -->
  <div class="stats-bar">
    <div class="stat">
      <div class="stat-number">2019</div>
      <div class="stat-label">成立于</div>
    </div>
    <div class="stat">
      <div class="stat-number">3</div>
      <div class="stat-label">城市分支</div>
    </div>
    <div class="stat">
      <div class="stat-number">2万+</div>
      <div class="stat-label">毕业生</div>
    </div>
    <div class="stat">
      <div class="stat-number">10年+</div>
      <div class="stat-label">翻译经验</div>
    </div>
  </div>
</div>

<script>
  // Generate decorative dots
  const dotsContainer = document.getElementById('dots');
  for (let row = 0; row < 6; row++) {
    for (let col = 0; col < 8; col++) {
      const dot = document.createElement('span');
      dot.style.opacity = (Math.random() * 0.5 + 0.3).toFixed(2);
      dotsContainer.appendChild(dot);
    }
    dotsContainer.appendChild(document.createElement('br'));
  }
</script>
</body>
</html>
